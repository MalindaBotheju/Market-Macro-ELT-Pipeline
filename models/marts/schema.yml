version: 2

models:
  - name: dim_ticker
    description: "One row per ticker."
    columns:
      - name: ticker_key
        tests: [not_null, unique]

  - name: dim_date
    description: "One row per calendar day, gap-free, spanning both sources."
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: fact_stock_price
    description: "One row per ticker per trading day."
    columns:
      - name: ticker_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_ticker')
              field: ticker_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: fact_macro_indicator
    description: "One row per macro series per observation day."
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: series_id
        tests: [not_null]
